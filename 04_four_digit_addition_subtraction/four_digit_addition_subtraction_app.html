<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1702 加 905：萬以下加法位值積木教具</title>
<style>
:root{--paper:#F7F3E8;--ink:#24303A;--blue:#2F5D7E;--gold:#C58A2B;--ok:#557A5A;--bad:#B7523E;--line:#C9C1B2;--card:#fffdf7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,"Noto Sans TC",sans-serif}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:clamp(1.6rem,4vw,2.5rem);border-bottom:4px solid var(--gold);padding-bottom:10px}.panel{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}.toolbar,.modebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{font:inherit;border:2px solid var(--blue);border-radius:7px;padding:10px 12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button:hover{background:#244a65}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#fff;color:var(--blue)}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.modebar button[aria-pressed=true]{background:var(--gold);border-color:#8b621b}.layout,.flight{display:grid;grid-template-columns:1fr 1.35fr;gap:14px}.source,.base,.warehouse{border:2px solid var(--line);padding:12px;margin:10px 0;background:#fff}.source h3,.base h3,.warehouse h3{margin:0 0 8px;color:var(--blue)}.base{border-color:var(--blue)}.warehouse{border-color:var(--gold)}.blocks{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}.block{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:5px;min-width:55px;min-height:44px;padding:2px 5px;background:#ead9a9;font-weight:700;font-size:.82rem}.block small{font-weight:500;font-size:.7rem}.block[data-value="1000"]{min-height:64px;background:#d7b56d}.block[data-value="100"]{background:#e2c98c}.block[data-value="10"]{min-width:42px;background:#eee0b9}.block[data-value="1"]{min-width:36px;background:#f7edcf}.columns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.place{border:2px solid var(--line);padding:8px;min-height:180px;text-align:center;background:#fff}.place.over{border-color:var(--gold);background:#fff8df}.place h3{margin:0;color:var(--blue)}.count{font-size:1.2rem;font-weight:700}.hint,.feedback{padding:10px;margin-top:10px;background:#f4ecd5;border-left:5px solid var(--gold);min-height:42px}.feedback.ok{border-color:var(--ok);color:var(--ok)}.feedback.bad{border-color:var(--bad);color:var(--bad)}.equation{font-size:1.3rem;border-left:5px solid var(--gold);padding:10px;margin-top:12px}.vertical{font:700 1.45rem/1.4 ui-monospace,monospace;white-space:pre;background:#fff;border:2px solid var(--line);padding:10px;display:inline-block}.line{position:relative;height:120px;margin:18px 10px;border-bottom:4px solid var(--blue);min-width:600px}.mark{position:absolute;bottom:55px;font-weight:700}.jump{position:absolute;bottom:10px;border-top:3px solid var(--gold);padding:4px}.choice{display:flex;gap:6px;flex-wrap:wrap}.note{color:#52606a}.hidden{display:none}@media(max-width:800px){main{padding:10px}.layout,.flight{grid-template-columns:1fr}.columns{grid-template-columns:repeat(2,1fr)}.line{min-width:520px}}
</style><style>.runway{position:relative;height:72px;border-top:3px dashed var(--line);border-bottom:3px dashed var(--line);margin:16px 0}.plane{position:absolute;left:0;top:13px;border:3px solid var(--blue);background:#fff;padding:8px 12px;border-radius:8px;font-weight:700;transition:left .55s ease}.plane.flying{left:78%}</style></head><body><main>
<h1>1702 + 905：積木、數線與直式</h1><p class="note">每次只做一件事。先看見兩組積木，再逐片合併；交換一定要由學生手動完成。</p>
<nav class="panel modebar" aria-label="教學模式"><strong>模式：</strong><button data-mode="teach" aria-pressed="true">教學模式</button><button data-mode="practice" aria-pressed="false">練習模式</button><button data-mode="flight" aria-pressed="false">積木飛機挑戰</button></nav>
<section id="teaching" class="panel"><h2>一、兩組原始積木</h2><div class="layout"><div><div class="source"><h3>1702 的積木</h3><div id="sourceA" class="blocks"></div></div><div class="source"><h3>905 的積木</h3><div id="sourceB" class="blocks"></div></div></div><div><h2>二、位值工作區</h2><div id="places" class="columns"></div><div id="hint" class="hint" role="status"></div><div class="toolbar"><button data-add="100">加入 1 個 100</button><button data-add="10">加入 1 個 10</button><button data-add="1">加入 1 個 1</button><button id="exchange" disabled>交換 10 個百</button><button class="secondary" id="reset">重新開始</button></div></div></div></section>
<section id="representations" class="panel"><h2>三、三種表示同步</h2><div class="equation" id="expanded"></div><p class="vertical" id="vertical"></p><div id="numberline" style="overflow-x:auto"></div></section>
<section id="flight" class="panel hidden"><h2>積木飛機：把 905 送到 1702 基地</h2><p>選擇一片積木再發射。每次只送一片，系統會檢查它應落在哪個位值欄。</p><div class="flight"><div class="base"><h3>飛機基地：1702</h3><div id="flightBase" class="columns"></div></div><div class="warehouse"><h3>積木倉庫：905</h3><div class="choice"><button data-launch="1000">發射 1000</button><button data-launch="100">發射 100</button><button data-launch="10">發射 10</button><button data-launch="1">發射 1</button></div><div id="flightMsg" class="feedback" role="status"></div><button id="flightExchange" disabled>交換 10 個百</button></div></div><button id="flightCheck">檢查是否過關</button></section>
<script>
const places=[['千位',1000],['百位',100],['十位',10],['個位',1]],initial=[1,7,0,2],need=[0,9,0,5];let counts=[...initial],sent=[0,0,0,0],exchanged=false;const $=id=>document.getElementById(id),label=v=>places.find(p=>p[1]===v);
function block(v){return `<span class="block" data-value="${v}" title="${v}，${label(v)[0]}"><span>${v}</span><small>${label(v)[0]}</small></span>`}function renderSource(id,a){$(id).innerHTML=places.map((p,i)=>Array(a[i]).fill(0).map(()=>block(p[1])).join('')).join('')||'（這組沒有積木）'}function renderPlaces(root='places',values=counts){$(root).innerHTML=places.map((p,i)=>`<div class="place ${values[i]>=10?'over':''}"><h3>${p[0]}</h3><div class="blocks">${Array(values[i]).fill(0).map(()=>block(p[1])).join('')}</div><div class="count">${values[i]} 個 ${p[1]}</div><small>距離 10 個還差 ${Math.max(0,10-values[i])} 個</small></div>`).join('')}
function renderAll(){renderPlaces();$('expanded').textContent=`目前：${counts[0]} 個千、${counts[1]} 個百、${counts[2]} 個十、${counts[3]} 個一。`;$('vertical').textContent=`  1702\n+ 0905\n──────\n  ${exchanged?'2607':'????'}`;$('numberline').innerHTML='<div class="line"><b class="mark" style="left:0">1702</b><span class="jump" style="left:38%">+900</span><span class="jump" style="left:70%">+5</span><b class="mark" style="right:0">'+(exchanged?'2607':'待交換')+'</b></div><p>開放數線：1702 → 2602 → 2607（先跳 +900，再跳 +5；十位保留 0）。</p>'}
function reset(){counts=[...initial];sent=[0,0,0,0];exchanged=false;$('exchange').disabled=true;$('hint').className='hint';$('hint').textContent='先觀察：7 個百和 9 個百合起來，還要逐片加入，不能直接跳到答案。';renderAll()}function add(v){let i=places.findIndex(p=>p[1]===v);if(counts[i]>=10&&!exchanged){$('hint').className='hint feedback bad';$('hint').textContent='目前百位有 10 個積木，請先交換；不能再加入。';return}counts[i]++;$('hint').className='hint';$('hint').textContent=`目前${places[i][0]}共有 ${counts[i]} 個 ${v}，距離 10 個還差 ${Math.max(0,10-counts[i])} 個。不要自動完成交換。`;if(v===100&&counts[i]===10){$('hint').textContent='10 個 100 可以交換成 1 個 1000。請按「交換 10 個百」。';$('exchange').disabled=false}renderAll()}function exchange(){if(counts[1]<10)return;counts[1]-=10;counts[0]++;exchanged=true;$('exchange').disabled=true;$('hint').className='hint feedback ok';$('hint').textContent='交換完成：10 個 100 進入交換區，換成 1 個 1000；百位剩 6 個，千位有 2 個。';renderAll()}
function flight(v){let i=places.findIndex(p=>p[1]===v);if(sent[i]>=need[i]){$('flightMsg').className='feedback bad';$('flightMsg').textContent=`905 不需要再送 ${v} 的積木。`;return}sent[i]++;counts[i]++;if(v===100&&counts[i]===10&&!exchanged){$('flightExchange').disabled=false;$('flightMsg').textContent='目前百位有 10 個積木，請手動交換後再繼續發射。'}else{$('flightMsg').textContent=`已發射 1 片 ${v}，這片應落在${places[i][0]}。`}renderPlaces('flightBase',counts);renderAll()}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(+b.dataset.add));$('exchange').onclick=exchange;$('reset').onclick=reset;document.querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>flight(+b.dataset.launch));$('flightCheck').onclick=()=>{let ok=exchanged&&sent.join(',')==='0,9,0,5'&&counts.join(',')==='2,6,0,7';$('flightMsg').className=ok?'feedback ok':'feedback bad';$('flightMsg').textContent=ok?'過關！你完成必要交換，1702 + 0905 = 2607。':'還不能過關：請完成百位交換，並檢查是否送出 9 個百、5 個一；十位是 0。'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('flight').classList.toggle('hidden',b.dataset.mode!=='flight');$('teaching').classList.toggle('hidden',b.dataset.mode==='flight');$('representations').classList.toggle('hidden',b.dataset.mode==='flight');if(b.dataset.mode==='flight'){reset();renderPlaces('flightBase',counts)}});renderSource('sourceA',initial);renderSource('sourceB',need);reset();
const runway=document.createElement('div');runway.className='runway';runway.innerHTML='<span id="plane" class="plane" aria-label="積木飛機">飛機 · 積木 1 片</span>';$('flight').insertBefore(runway,$('flight').firstElementChild.nextElementSibling);document.querySelectorAll('[data-launch]').forEach(b=>b.addEventListener('click',()=>{if($('plane')){$('plane').textContent='飛機 · '+b.dataset.launch;$('plane').classList.add('flying');setTimeout(()=>$('plane').classList.remove('flying'),600)}}));
</script></main></body></html>
</html>
<script>document.getElementById('flightExchange').onclick=function(){if(counts[1]>=10){counts[1]-=10;counts[0]++;exchanged=true;this.disabled=true;$('flightMsg').className='feedback ok';$('flightMsg').textContent='交換完成：10 個百換成 1 個千，現在百位剩 6 個。';renderPlaces('flightBase',counts);renderAll()}};</script>
