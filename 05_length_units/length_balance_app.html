<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>長度單位換算天平</title>
<style>
:root{--paper:#F7F3E8;--ink:#24303A;--blue:#2F5D7E;--gold:#C58A2B;--ok:#557A5A;--bad:#B7523E;--line:#C9C1B2;--card:#fffdf7;--wood:#ead9a9}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,"Noto Sans TC",sans-serif;user-select:none;-webkit-user-select:none}
main{max-width:1280px;margin:auto;padding:18px}
h1{font-size:clamp(1.7rem,4vw,2.5rem);border-bottom:4px solid var(--gold);margin:0 0 8px;padding-bottom:8px}
h2,h3{margin:.25em 0 .55em}
button,input,select{font:inherit}
button{border:2px solid var(--blue);border-radius:7px;background:var(--blue);color:white;padding:9px 13px;font-weight:700;cursor:pointer;touch-action:manipulation}
button.secondary{background:#fff;color:var(--blue)}
button.gold{background:var(--gold);border-color:#8b621b;color:#211b10}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:11px;padding:15px;margin:13px 0}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.muted{color:#52606a}
.small{font-size:.9rem}
.levelbar{display:flex;gap:7px;flex-wrap:wrap}
.levelbar button[aria-pressed=true]{background:var(--gold);border-color:#8b621b;color:#211b10}
.grid{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(420px,1.5fr);gap:13px}
.bank,.tray{border:2px solid var(--line);border-radius:8px;padding:12px;background:white}
.denoms{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px}
.denom{background:#f2e8ce;color:var(--ink);border:2px solid #88754e;min-height:65px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.denom:active{cursor:grabbing}
.denom[aria-pressed=true]{outline:3px solid var(--gold);outline-offset:1px}
.denom b{display:block;font-size:1.15rem;pointer-events:none}
.denom small{display:block;font-weight:500;pointer-events:none}
.work{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{border:3px solid var(--line);border-radius:9px;padding:10px;min-height:150px;background:#fff;transition:background .15s, border-color .15s}
.side h3{display:flex;justify-content:space-between;margin-top:0}
.side.drop{background:#fff4d6;border-color:var(--gold)}
.tokens{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;min-height:62px}
.token{display:inline-flex;align-items:center;justify-content:center;flex-direction:column;border:2px solid #695b3e;border-radius:5px;background:var(--wood);color:var(--ink);min-width:54px;min-height:44px;padding:3px 7px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.token:active{cursor:grabbing}
.token[data-kind="m"]{background:#d7b56d;min-height:55px}
.token[data-kind="10cm"]{background:#e2c98c}
.token[data-kind="cm"]{background:#eee0b9;min-width:46px}
.token[data-kind="10mm"]{background:#eee0b9;min-width:46px}
.token[data-kind="mm"]{background:#f7edcf;min-width:43px}
.token.selected{outline:3px solid var(--blue);outline-offset:2px}
.token.dragging-source{opacity:0.35}
.token span,.token small{pointer-events:none}
.token small{font-size:.7rem;font-weight:600}
.token:focus-visible{outline:3px solid var(--gold)}
.drag-proxy{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;opacity:0.9;transform:translate(-50%,-50%);box-shadow:0 6px 14px rgba(36,48,58,0.25);border:2px solid var(--blue)}
.tools{margin-top:10px}
.status,.feedback{padding:10px;background:#f4ecd5;border-left:5px solid var(--gold);margin:8px 0;min-height:44px}
.feedback.ok{border-color:var(--ok);background:#edf2e9}
.feedback.bad{border-color:var(--bad);background:#f8ece8}
.balance{height:175px;position:relative;margin:6px auto 0;max-width:650px}
.beam{position:absolute;left:14%;right:14%;top:52px;height:12px;background:#9a7543;border:2px solid #624c30;border-radius:8px;transform-origin:50% 50%;transition:transform .35s}
.fulcrum{position:absolute;left:calc(50% - 28px);top:64px;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-bottom:80px solid #b59a68}
.pan{position:absolute;top:58px;width:34%;height:65px;border-bottom:4px solid #725b38;border-left:2px solid #725b38;border-right:2px solid #725b38;border-radius:0 0 40% 40%;display:grid;place-items:end center;font-weight:700}
.pan.left{left:5%}
.pan.right{right:5%}
.balanceword{position:absolute;top:140px;width:100%;text-align:center;font-weight:800;color:var(--ok)}
.measure{overflow-x:auto}
.ruler{min-width:330px;padding:8px 2px}
.barline{height:22px;position:relative;margin:9px 0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);background:#e5d9bf}
.barline.left{background:#d7b56d}
.barline.right{background:#9db0b4}
.tickrow{height:30px;position:relative;border-top:2px solid var(--ink)}
.tick{position:absolute;top:-3px;border-left:2px solid var(--ink);height:11px;font-size:.75rem;padding:10px 0 0 3px;white-space:nowrap}
.math{font-size:1.15rem;background:#fff;border:1px solid var(--line);padding:10px;overflow-wrap:anywhere}
.answerbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answerbox input{width:85px;padding:7px;border:2px solid var(--line);border-radius:5px}
.hidden{display:none}
@media(max-width:850px){main{padding:10px}.grid{grid-template-columns:1fr}.work{grid-template-columns:1fr 1fr}.panel{padding:11px}}
@media(max-width:480px){.work{grid-template-columns:1fr}.denoms{grid-template-columns:1fr 1fr}body{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<h1>長度單位換算天平</h1>
<p class="muted">先說想法，再選代幣配平。每次拆解或合成一層；代幣、天平、尺規與算式會一起更新。</p>

<section class="panel">
  <h2>選擇關卡</h2>
  <div class="levelbar" id="levels" aria-label="六個關卡"></div>
  <div id="mission" class="status" role="status"></div>
</section>

<section class="panel">
  <div class="grid">
    <div>
      <h2>代幣庫</h2>
      <p class="small muted">選面額，按「放到右盤」；或按住代幣拖入天平。亦可將盤上代幣拖到另一盤或移出工作區。</p>
      <label class="small"><input type="checkbox" id="showMmValue"> 在非 mm 代幣上顯示對應的毫米值</label>
      <div class="denoms" id="denoms"></div>
      <div class="row tools">
        <button id="addLeft" class="secondary">放到左盤</button>
        <button id="addRight">放到右盤</button>
      </div>
      <div class="status" id="selection" aria-live="polite">尚未選取面額。</div>
    </div>
    <div class="workzone">
      <h2>天平工作區</h2>
      <div class="balance" aria-label="長度天平">
        <div class="beam" id="beam"></div>
        <div class="fulcrum"></div>
        <div class="pan left">左盤</div>
        <div class="pan right">右盤</div>
        <div class="balanceword" id="balanceWord"></div>
      </div>
      <div class="work">
        <div class="side" id="left" data-side="left" aria-label="左盤代幣區">
          <h3><span>左盤</span><span id="leftTotal">0 mm</span></h3>
          <div class="tokens"></div>
        </div>
        <div class="side" id="right" data-side="right" aria-label="右盤代幣區">
          <h3><span>右盤</span><span id="rightTotal">0 mm</span></h3>
          <div class="tokens"></div>
        </div>
      </div>
      <div class="row tools">
        <button id="moveLeft" class="secondary">移動選取至左盤</button>
        <button id="moveRight" class="secondary">移動選取至右盤</button>
        <button id="breakBtn" class="secondary">拆解選取代幣</button>
        <button id="mergeBtn" class="secondary">合成選取的 10 枚</button>
        <button id="toBank" class="secondary">移回代幣庫</button>
        <button id="undo" class="secondary">復原上一步</button>
        <button id="reset" class="secondary">重設本關</button>
      </div>
      <div id="tokenHint" class="status" aria-live="polite">選取盤上的代幣後，可拆解或合成。</div>
    </div>
  </div>
</section>

<section class="panel">
  <h2>同步觀察</h2>
  <div id="difference" class="feedback" role="status" aria-live="polite"></div>
  <h3>即時尺規（比例會依較長的一盤調整）</h3>
  <div class="measure"><div id="ruler" class="ruler"></div></div>
  <h3>複名數位值展開</h3>
  <div id="placeValue" class="math"></div>
  <div id="equivalence" class="math" style="margin-top:8px"></div>
</section>

<section class="panel">
  <h2>說一說／寫一寫</h2>
  <div id="answerTask"></div>
  <div id="answerFeedback" class="feedback" role="status" aria-live="polite">先觀察代幣與展開式，再回答。</div>
  <div class="row tools">
    <button id="check">檢查答案</button>
    <button id="next" class="secondary">下一關</button>
  </div>
</section>

<p class="small muted">教師提示：請學生先描述哪盤較長、差多少，再選擇代幣；顏色只作輔助，所有狀態都有文字說明。</p>
</main>

<script>
'use strict';
const DENOMS=[
  {kind:'m',label:'1 m',mm:1000,next:'10cm',children:10},
  {kind:'10cm',label:'10 cm',mm:100,next:'cm',children:10},
  {kind:'cm',label:'1 cm',mm:10,next:'mm',children:10},
  {kind:'10mm',label:'10 mm',mm:10,next:'mm',children:10},
  {kind:'mm',label:'1 mm',mm:1,next:null,children:0}
];
const LEVELS=[
 {title:'1｜公分與毫米',goal:10,left:[['cm',1]],task:'左盤是 1 cm。右盤要放幾個 1 mm 才會一樣長？',answer:{mm:10}},
 {title:'2｜10 cm 與 100 mm',goal:100,left:[['10cm',1]],task:'左盤是 10 cm。試用 1 cm 或 1 mm 配平，並說明 10 cm 等於多少 mm。',answer:{mm:100}},
 {title:'3｜公尺與公分',goal:1000,left:[['m',1]],task:'左盤是 1 m。用 10 cm 代幣配平，再說明共有幾個 1 cm。',answer:{mm:1000}},
 {title:'4｜毫米轉複名數',goal:3300,left:[['m',3],['10cm',3]],task:'3300 mm 等於幾 m、幾 cm？觀察千毫米和百毫米怎麼分組。',answer:{m:3,cm:30,mm:0}},
 {title:'5｜複名數轉毫米',goal:2054,left:[['m',2],['cm',5],['mm',4]],task:'2 m 5 cm 4 mm 一共是多少 mm？先預測，再看各部分換成毫米。',answer:{mm:2054}},
 {title:'6｜自由探索',goal:null,left:[],task:'輸入一個毫米目標，或在左盤自行建立長度；再用不同面額配平。通過只看總長相等。',answer:null}
];

let level=0,selectedKind='mm',selected=new Set(),tokens=[],serial=0,history=[],target=10;
const $=id=>document.getElementById(id), denom=k=>DENOMS.find(d=>d.kind===k), fmt=n=>`${n} mm`;

function snap(){
  history.push(JSON.stringify({tokens,selectedKind,target,level,serial}));
  if(history.length>30)history.shift();
}
function newToken(kind,side){return{id:'t'+(++serial),kind,side}}

function initLevel(n){
  level=n;
  selected.clear();
  history=[];
  const cfg=LEVELS[level];
  target=cfg.goal??500;
  tokens=[];
  for(const [k,c] of cfg.left) {
    for(let i=0;i<c;i++) tokens.push(newToken(k,'left'));
  }
  if(level===5&&cfg.goal===null){
    $('mission').innerHTML=`${cfg.task} 自訂目標（1–5000 mm）： <input id="customTarget" type="number" min="1" max="5000" value="500" aria-label="自由探索目標毫米"> <button id="setTarget" class="secondary">設定目標</button> <button id="clearLeft" class="secondary">清空左盤</button>`;
  } else {
    $('mission').textContent=cfg.task;
  }
  renderLevels();
  renderAnswer();
  renderAll();
  $('answerFeedback').className='feedback';
  $('answerFeedback').textContent='先觀察代幣與展開式，再回答。';
}

function renderLevels(){
  $('levels').innerHTML=LEVELS.map((x,i)=>`<button class="${i===level?'gold':''}" aria-pressed="${i===level}" data-level="${i}">${x.title}</button>`).join('');
  document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>initLevel(+b.dataset.level));
}

function detail(d){
  if(!d) return '';
  if(d.kind==='mm')return '1 mm';
  if(d.kind==='10mm')return '10 mm';
  return $('showMmValue').checked?`${d.label}／${d.mm} mm`:d.label;
}

function renderDenoms(){
  $('denoms').innerHTML=DENOMS.map(d=>`<button class="denom" data-kind="${d.kind}" aria-pressed="${d.kind===selectedKind}"><b>${d.label}</b><small>${d.kind==='10mm'?'等於 1 cm；可拆成 10 個 1 mm':$('showMmValue').checked&&d.kind!=='mm'?`${d.mm} mm`:d.kind==='mm'?'最小單位':''}</small></button>`).join('');
  document.querySelectorAll('.denom').forEach(b=>{
    b.addEventListener('click',()=>{
      if(activeDrag) return;
      selectedKind=b.dataset.kind;
      renderDenoms();
      $('selection').textContent=`已選 ${detail(denom(selectedKind))}；選盤後放入或直接拖曳。`;
    });
    b.addEventListener('pointerdown',e=>{
      startPointerDrag(e,{type:'bank',kind:b.dataset.kind,element:b});
    });
  });
}

function total(side){return tokens.filter(t=>t.side===side).reduce((a,t)=>a+denom(t.kind).mm,0)}

function renderSide(side){
  const root=$(side),arr=tokens.filter(t=>t.side===side);
  root.querySelector('.tokens').innerHTML=arr.map(t=>`<button class="token ${selected.has(t.id)?'selected':''}" data-kind="${t.kind}" data-id="${t.id}" aria-pressed="${selected.has(t.id)}" aria-label="${detail(denom(t.kind))}，${side==='left'?'左盤':'右盤'}，${selected.has(t.id)?'已選取':'未選取'}"><span>${detail(denom(t.kind))}</span></button>`).join('')||'<span class="muted small">尚無代幣</span>';
  root.querySelectorAll('.token').forEach(b=>{
    b.addEventListener('click',()=>{
      if(activeDrag) return;
      toggle(b.dataset.id);
    });
    b.addEventListener('pointerdown',e=>{
      startPointerDrag(e,{type:'token',id:b.dataset.id,element:b});
    });
  });
}

function normalize(n){
  const m=Math.floor(n/1000),cm=Math.floor((n%1000)/10),mm=n%10;
  return{m,cm,mm};
}

function renderRuler(a,b){
  const max=Math.max(a,b,100),scale=280/max,shownMax=max,step=max>2000?500:max>500?100:max>100?20:10;
  let ticks='';
  for(let x=0;x<=shownMax;x+=step)ticks+=`<span class="tick" style="left:${x/max*100}%">${x===0?'0':x}</span>`;
  $('ruler').innerHTML=`<div class="small muted">0 ──────────── ${shownMax} mm（每小格 ${step} mm）</div><div class="barline left" style="width:${Math.max(a*scale,1)}px;max-width:100%" title="左盤 ${a} mm"></div><div class="barline right" style="width:${Math.max(b*scale,1)}px;max-width:100%" title="右盤 ${b} mm"></div><div class="tickrow">${ticks}</div><div class="small">上方線段：左盤 ${a} mm；下方線段：右盤 ${b} mm。</div>`;
}

function renderAll(){
  renderDenoms();
  renderSide('left');
  renderSide('right');
  const a=total('left'),b=total('right'),diff=b-a;
  $('leftTotal').textContent=fmt(a);
  $('rightTotal').textContent=fmt(b);
  $('beam').style.transform=`rotate(${Math.max(-12,Math.min(12,diff/Math.max(a,b,100)*12))}deg)`;
  $('balanceWord').textContent=diff===0?'平衡：兩盤一樣長':'天平傾斜方向與文字差額一起判讀';
  const d=$('difference');
  d.className='feedback '+(diff===0?'ok':'bad');
  d.textContent=diff===0?`平衡！左盤 ${a} mm，右盤 ${b} mm，兩盤相差 0 mm。`:`${diff<0?'左盤':'右盤'}較長，${diff<0?'右盤還差':'右盤多出'} ${Math.abs(diff)} mm。差額＝右盤 ${b} − 左盤 ${a} ＝ ${diff} mm。`;
  renderRuler(a,b);
  const p=normalize(a),pB=normalize(b);
  $('placeValue').innerHTML=`左盤：${a} mm = ${Math.floor(a/1000)*1000} mm + ${Math.floor((a%1000)/10)*10} mm + ${a%10} mm = <b>${p.m} m ${p.cm} cm ${p.mm} mm</b><br>右盤：${b} mm = ${Math.floor(b/1000)*1000} mm + ${Math.floor((b%1000)/10)*10} mm + ${b%10} mm = <b>${pB.m} m ${pB.cm} cm ${pB.mm} mm</b>`;
  $('equivalence').textContent=`換算關係：1 m = 10 個 10 cm = 100 cm = 1000 mm；10 cm = 10 個 1 cm = 100 mm；1 cm = 10 mm = 10 個 1 mm；10 mm 代幣與 1 cm 等值。`;
  
  const sel=[...selected].map(id=>tokens.find(t=>t.id===id)).filter(Boolean);
  const same=sel.length>0&&sel.every(t=>t.kind===sel[0].kind&&t.side===sel[0].side);
  $('breakBtn').disabled=sel.length!==1||!denom(sel[0]?.kind)?.next;
  $('mergeBtn').disabled=sel.length!==10||!same||(!denom(sel[0]?.kind)?.next&&sel[0]?.kind!=='mm');
  $('toBank').disabled=!sel.length;
  $('undo').disabled=!history.length;
}

function toggle(id){
  if(selected.has(id))selected.delete(id);
  else selected.add(id);
  renderAll();
}

function place(side){
  snap();
  tokens.push(newToken(selectedKind,side));
  selected.clear();
  $('tokenHint').textContent=`放入 1 枚 ${denom(selectedKind).label}（${denom(selectedKind).mm} mm）到${side==='left'?'左':'右'}盤。`;
  renderAll();
}

function moveSelectedTo(side){
  if(!selected.size) return;
  snap();
  tokens.forEach(t=>{
    if(selected.has(t.id)) t.side=side;
  });
  selected.clear();
  $('tokenHint').textContent=`已將選取代幣移動至${side==='left'?'左':'右'}盤。`;
  renderAll();
}

function transformBreak(){
  const id=[...selected][0],t=tokens.find(x=>x.id===id),d=denom(t?.kind);
  if(!d?.next)return;
  snap();
  tokens=tokens.filter(x=>x.id!==id);
  for(let i=0;i<d.children;i++)tokens.push(newToken(d.next,t.side));
  selected.clear();
  $('tokenHint').textContent=`拆解完成：1 枚 ${d.label} = ${d.children} 枚 ${denom(d.next).label}；總長仍是 ${d.mm} mm。`;
  renderAll();
}

function transformMerge(){
  const group=tokens.filter(t=>selected.has(t.id));
  if(group.length!==10||group.some(t=>t.kind!==group[0].kind||t.side!==group[0].side))return;
  const d=denom(group[0].kind),up=d.kind==='mm'?'cm':d.kind==='cm'||d.kind==='10mm'?'10cm':d.kind==='10cm'?'m':null;
  if(!up)return;
  snap();
  const side=group[0].side;
  tokens=tokens.filter(t=>!selected.has(t.id));
  tokens.push(newToken(up,side));
  selected.clear();
  $('tokenHint').textContent=`合成完成：10 枚 ${d.label} = 1 枚 ${denom(up).label}；總長仍是 ${d.mm*10} mm。`;
  renderAll();
}

function undo(){
  if(!history.length)return;
  const s=JSON.parse(history.pop());
  tokens=s.tokens;
  selected.clear();
  selectedKind=s.selectedKind;
  target=s.target;
  level=s.level;
  serial=s.serial;
  renderAll();
  $('tokenHint').textContent='已復原上一個操作。';
}

function renderAnswer(){
  const cfg=LEVELS[level];
  if(level===5){
    $('answerTask').innerHTML=`<div class="answerbox">自由目標：<b>${target} mm</b>。總長相等即可，不限代幣組合。</div>`;
    return;
  }
  if(level===2)$('answerTask').innerHTML=`<div class="answerbox">${cfg.task}<label>公分 <input id="ansCm" type="number" min="0" aria-label="答案公分"></label></div>`;
  else if(level===3)$('answerTask').innerHTML=`<div class="answerbox">${cfg.task}<label>公尺 <input id="ansM" type="number" min="0" aria-label="答案公尺"></label><label>公分 <input id="ansCm" type="number" min="0" aria-label="答案公分"></label></div>`;
  else if(level===4)$('answerTask').innerHTML=`<div class="answerbox">${cfg.task}<label>毫米 <input id="ansMm" type="number" min="0" aria-label="答案毫米"></label></div>`;
  else $('answerTask').innerHTML=`<div class="answerbox">${cfg.task}<label>毫米 <input id="ansMm" type="number" min="0" aria-label="答案毫米"></label></div>`;
}

function checkAnswer(){
  const a=total('left'),b=total('right'),cfg=LEVELS[level];
  if(level===5){
    const ok=a===b&&a===target;
    $('answerFeedback').className='feedback '+(ok?'ok':'bad');
    $('answerFeedback').textContent=ok?'兩盤總長相等，完成自由探索！請再用另一種代幣組合驗證。':`目前左盤 ${a} mm、右盤 ${b} mm；${a===b?'':'先配平，'}目標是 ${target} mm。`;
    return;
  }
  let answerOK=false;
  if(level===2)answerOK=+$('ansCm').value===100;
  else if(level===3)answerOK=+$('ansM').value===3&&+$('ansCm').value===30;
  else if(level===4)answerOK=+$('ansMm').value===2054;
  else answerOK=+$('ansMm').value===cfg.answer.mm;
  const balanceOK=b===cfg.goal;
  const ok=answerOK&&(level===3||level===4?balanceOK:true);
  if(ok){
    $('answerFeedback').className='feedback ok';
    $('answerFeedback').textContent=level===2?'正確：右盤配成 1000 mm，與左盤的 1 m 等長；1 m = 100 cm。':level===3?'正確：3300 mm = 3000 mm + 300 mm = 3 m 30 cm。留意 300 mm 是 30 cm。':level===4?'正確：2 m = 2000 mm，5 cm = 50 mm，再加 4 mm，共 2054 mm。':`正確：${cfg.goal===10?'10 個 1 mm = 1 cm。':cfg.goal===100?'10 cm = 100 mm。':'1 m = 100 cm = 1000 mm。'}`;
  } else {
    $('answerFeedback').className='feedback bad';
    $('answerFeedback').textContent=answerOK&&!balanceOK?`答案正確；請先把右盤配成 ${cfg.goal} mm，再檢查天平。`:level===3?'請檢查左盤的 1 m 需要多少毫米，並以代幣將右盤配平。':level===4?'請檢查右盤代幣總長是否為 3300 mm，再分組成公尺與公分。':level===5?'分段檢查：2 m 有幾毫米？5 cm 有幾毫米？最後再加 4 mm。':`再檢查單位和數量：左盤目標是 ${cfg.goal} mm，右盤目前 ${b} mm。`;
  }
}

// ----------------------------------------------------
// 通用 Pointer Events 拖曳機制 (支援 iPad / 平板觸控與滑鼠)
// ----------------------------------------------------
let activeDrag=null;

function startPointerDrag(e,data){
  if(e.button!==undefined&&e.button!==0) return; // 僅支援主按鍵/觸控
  const startX=e.clientX, startY=e.clientY;
  const pointerId=e.pointerId;
  let isDragging=false;
  let proxy=null;
  const DRAG_THRESHOLD=5; // 避免誤觸拖曳

  function onPointerMove(ev){
    if(ev.pointerId!==pointerId) return;
    const dx=ev.clientX-startX, dy=ev.clientY-startY;
    if(!isDragging){
      if(Math.hypot(dx,dy)>=DRAG_THRESHOLD){
        isDragging=true;
        activeDrag=data;
        createProxy(ev.clientX,ev.clientY);
        if(data.type==='token'&&data.element){
          data.element.classList.add('dragging-source');
        }
      }
    }
    if(isDragging&&proxy){
      proxy.style.left=`${ev.clientX}px`;
      proxy.style.top=`${ev.clientY}px`;
      updateDropHighlight(ev.clientX,ev.clientY);
    }
  }

  function onPointerUp(ev){
    if(ev.pointerId!==pointerId) return;
    cleanup();
    if(isDragging){
      handleDrop(ev.clientX,ev.clientY,data);
    }
    setTimeout(()=>{ activeDrag=null; },50);
  }

  function onPointerCancel(ev){
    if(ev.pointerId!==pointerId) return;
    cleanup();
    activeDrag=null;
    renderAll();
  }

  function cleanup(){
    window.removeEventListener('pointermove',onPointerMove);
    window.removeEventListener('pointerup',onPointerUp);
    window.removeEventListener('pointercancel',onPointerCancel);
    document.querySelectorAll('.side').forEach(el=>el.classList.remove('drop'));
    if(proxy){
      proxy.remove();
      proxy=null;
    }
    if(data.type==='token'&&data.element){
      data.element.classList.remove('dragging-source');
    }
  }

  function createProxy(x,y){
    proxy=document.createElement('div');
    proxy.className='token drag-proxy';
    let kind=data.kind;
    if(data.type==='token'){
      const t=tokens.find(item=>item.id===data.id);
      if(t) kind=t.kind;
    }
    proxy.setAttribute('data-kind',kind);
    const d=denom(kind);
    proxy.innerHTML=`<span>${detail(d)}</span>`;
    proxy.style.left=`${x}px`;
    proxy.style.top=`${y}px`;
    document.body.appendChild(proxy);
  }

  function updateDropHighlight(x,y){
    const el=document.elementFromPoint(x,y);
    const sideEl=el?.closest('.side');
    document.querySelectorAll('.side').forEach(s=>{
      if(s===sideEl) s.classList.add('drop');
      else s.classList.remove('drop');
    });
  }

  window.addEventListener('pointermove',onPointerMove);
  window.addEventListener('pointerup',onPointerUp);
  window.addEventListener('pointercancel',onPointerCancel);
}

function handleDrop(x,y,data){
  document.querySelectorAll('.side').forEach(el=>el.classList.remove('drop'));
  const el=document.elementFromPoint(x,y);
  const targetSide=el?.closest('.side')?.dataset?.side;
  const workzone=document.querySelector('.workzone');
  const wzRect=workzone?.getBoundingClientRect();
  const insideWorkzone=wzRect&&(x>=wzRect.left&&x<=wzRect.right&&y>=wzRect.top&&y<=wzRect.bottom);

  if(targetSide){
    // 落在左盤或右盤
    snap();
    if(data.type==='bank'){
      tokens.push(newToken(data.kind,targetSide));
      selected.clear();
      $('tokenHint').textContent=`拖入 1 枚 ${denom(data.kind).label} 到${targetSide==='left'?'左':'右'}盤；總長與差額已更新。`;
    } else if(data.type==='token'){
      const t=tokens.find(item=>item.id===data.id);
      if(t){
        const prevSide=t.side;
        t.side=targetSide;
        selected.clear();
        $('tokenHint').textContent=prevSide===targetSide?'代幣已放置；總長保持同步。':`已移動代幣至${targetSide==='left'?'左':'右'}盤；總長與差額已更新。`;
      }
    }
    renderAll();
  } else if(data.type==='token'&&!insideWorkzone){
    // 盤上代幣拖出天平工作區 -> 移回代幣庫
    snap();
    tokens=tokens.filter(item=>item.id!==data.id);
    selected.delete(data.id);
    renderAll();
    $('tokenHint').textContent='代幣已拖出天平工作區並移回代幣庫；總長、尺規與差額已更新。';
  } else {
    // 未落在有效區域或在工作區內未放進盤中 -> 平滑復原
    renderAll();
  }
}

$('showMmValue').onchange=renderAll;
$('addLeft').onclick=()=>place('left');
$('addRight').onclick=()=>place('right');
$('moveLeft').onclick=()=>moveSelectedTo('left');
$('moveRight').onclick=()=>moveSelectedTo('right');
$('breakBtn').onclick=transformBreak;
$('mergeBtn').onclick=transformMerge;
$('toBank').onclick=()=>{
  snap();
  tokens=tokens.filter(t=>!selected.has(t.id));
  selected.clear();
  renderAll();
  $('tokenHint').textContent='選取代幣已移回代幣庫。';
};
$('undo').onclick=undo;
$('reset').onclick=()=>initLevel(level);
$('check').onclick=checkAnswer;
$('next').onclick=()=>initLevel((level+1)%LEVELS.length);

window.addEventListener('blur',()=>{
  document.querySelectorAll('.side').forEach(el=>el.classList.remove('drop'));
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    selected.clear();
    renderAll();
    $('tokenHint').textContent='已取消代幣選取。';
  }
});
document.addEventListener('click',e=>{
  if(e.target.id==='setTarget'){
    const n=+$('customTarget').value;
    if(n<1||n>5000){
      $('answerFeedback').className='feedback bad';
      $('answerFeedback').textContent='目標需介於 1 到 5000 mm。';
      return;
    }
    snap();
    target=n;
    tokens=tokens.filter(t=>t.side!=='left');
    let rest=n;
    for(const d of DENOMS){
      const count=Math.floor(rest/d.mm);
      for(let i=0;i<count;i++)tokens.push(newToken(d.kind,'left'));
      rest-=count*d.mm;
    }
    $('mission').querySelector('input').value=n;
    renderAnswer();
    renderAll();
    $('tokenHint').textContent=`已用合適面額在左盤表示 ${n} mm，可拆解後繼續探索。`;
  }
  if(e.target.id==='clearLeft'){
    snap();
    tokens=tokens.filter(t=>t.side!=='left');
    renderAll();
    $('tokenHint').textContent='左盤已清空；可用代幣庫在左盤建立目標。';
  }
});

initLevel(0);
</script>
